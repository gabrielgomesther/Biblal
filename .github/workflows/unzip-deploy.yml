name: Descompactar e Publicar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Descompactar arquivos .zip (ignorando workflows internos)
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z" -x ".github/*" -d .
              rm "$z"
            fi
          done

      - name: Salvar arquivos extraídos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || (git commit -m "Arquivos extraídos do ZIP automaticamente" && git push)
